<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topomap & Functional Connectivity</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #07090f; /* Deep, tech-minimalist dark */
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #eeg-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #portfolio-layer {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.85);
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 4px;
            margin-bottom: 4px;
            font-size: 2.2rem;
            text-transform: uppercase;
        }

        p {
            color: #00f0ff; /* Subtle cyan accent */
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <canvas id="eeg-canvas"></canvas>

    <div id="portfolio-layer">
        <h1>Pattern Architecture</h1>
        <p>Real-time Functional Connectivity & Topographical Mapping</p>
    </div>

    <script>
        const canvas = document.getElementById('eeg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let eegNodes = [];
        let mouse = { x: -1000, y: -1000 };

        // --- HYPERPARAMETERS ---
        const activationRadius = 150; 
        const connectivityThreshold = 0.15; // Minimum activation to draw a line
        const baseColor = 'rgba(42, 59, 92, 0.4)'; // Faint resting state
        const activeColor = '#00f0ff'; // Vibrant cyan for activation
        // -----------------------

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initTopomap();
        }
        window.addEventListener('resize', resize);

        class EEGChannel {
            constructor(cx, cy, radius, angle, label) {
                // Polar to Cartesian conversion (offset by -90deg so nose points UP)
                this.x = cx + radius * Math.cos(angle - Math.PI / 2);
                this.y = cy + radius * Math.sin(angle - Math.PI / 2);
                this.label = label;
                this.activation = 0;
                
                // Pre-assign a few random "long-range" peers for cross-hemisphere connectivity
                this.peers = [];
            }

            update() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // Calculate local field power / activation
                if (distance < activationRadius) {
                    // Smooth gaussian-like falloff
                    let rawActivation = 1 - (distance / activationRadius);
                    this.activation += (rawActivation - this.activation) * 0.1; 
                } else {
                    // Decay back to baseline
                    this.activation *= 0.90; 
                }
            }

            drawNode() {
                // Interpolate colors based on activation
                const alpha = 0.2 + (this.activation * 0.8);
                const size = 3 + (this.activation * 2);

                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                
                if (this.activation > 0.05) {
                    ctx.fillStyle = activeColor;
                    ctx.shadowBlur = 10 * this.activation;
                    ctx.shadowColor = activeColor;
                } else {
                    ctx.fillStyle = '#111520';
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                
                // Stroke
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = this.activation > 0.05 ? activeColor : baseColor;
                ctx.stroke();
                ctx.shadowBlur = 0; // reset
            }
        }

        function initTopomap() {
            eegNodes = [];
            const cx = width / 2;
            const cy = height / 2;
            const maxR = Math.min(width, height) * 0.35; // Scale to screen

            // Concentric rings to simulate a standard layout (e.g., 10-20 system)
            const rings = [
                { r: 0, count: 1 },                 // Cz
                { r: maxR * 0.33, count: 6 },       // Inner ring
                { r: maxR * 0.66, count: 12 },      // Middle ring
                { r: maxR, count: 18 }              // Outer ring
            ];

            let index = 0;
            rings.forEach(ring => {
                for (let i = 0; i < ring.count; i++) {
                    let angle = (Math.PI * 2 / ring.count) * i;
                    eegNodes.push(new EEGChannel(cx, cy, ring.r, angle, `CH${index++}`));
                }
            });

            // Assign functional connectivity peers (simulating resting state networks)
            eegNodes.forEach(node => {
                // Connect to 2-3 random distant nodes to simulate long-range phase locking
                let peerCount = Math.floor(Math.random() * 2) + 2;
                for (let i = 0; i < peerCount; i++) {
                    let randomPeer = eegNodes[Math.floor(Math.random() * eegNodes.length)];
                    if (randomPeer !== node && !node.peers.includes(randomPeer)) {
                        node.peers.push(randomPeer);
                    }
                }
            });
        }

        function drawHeadShape() {
            const cx = width / 2;
            const cy = height / 2;
            const maxR = Math.min(width, height) * 0.35;

            // Draw abstract nose indicator (triangle at the top)
            ctx.beginPath();
            ctx.moveTo(cx, cy - maxR - 20);
            ctx.lineTo(cx - 15, cy - maxR);
            ctx.lineTo(cx + 15, cy - maxR);
            ctx.closePath();
            ctx.strokeStyle = baseColor;
            ctx.stroke();

            // Draw faint outer boundary of the scalp
            ctx.beginPath();
            ctx.arc(cx, cy, maxR + 10, 0, Math.PI * 2);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 10]);
            ctx.stroke();
            ctx.setLineDash([]); // Reset
        }

        function drawTopomapGlow() {
            // Draws a smooth, moving radial gradient under the cursor 
            // representing interpolated topographical "heat"
            const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, activationRadius * 1.5);
            gradient.addColorStop(0, 'rgba(0, 240, 255, 0.08)');
            gradient.addColorStop(0.5, 'rgba(0, 100, 255, 0.03)');
            gradient.addColorStop(1, 'rgba(7, 9, 15, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function drawConnectivity() {
            ctx.lineWidth = 1;
            
            eegNodes.forEach(node => {
                if (node.activation < connectivityThreshold) return;

                node.peers.forEach(peer => {
                    // Combine activation of source and target
                    const coherence = (node.activation + peer.activation) / 2;
                    
                    if (coherence > 0.05) {
                        ctx.beginPath();
                        ctx.moveTo(node.x, node.y);

                        // Use a bezier curve through the center to look like internal brain tracts
                        const cx = width / 2;
                        const cy = height / 2;
                        
                        // Control point pulls the line slightly towards the center
                        const cpX = (node.x + peer.x) / 2 * 0.6 + cx * 0.4;
                        const cpY = (node.y + peer.y) / 2 * 0.6 + cy * 0.4;

                        ctx.quadraticCurveTo(cpX, cpY, peer.x, peer.y);
                        
                        // Opacity based on coherence strength
                        ctx.strokeStyle = `rgba(0, 240, 255, ${coherence * 0.6})`;
                        ctx.stroke();
                    }
                });
            });
        }

        function animate() {
            // Clear screen
            ctx.clearRect(0, 0, width, height);

            // 1. Draw the smooth interpolated glow
            if (mouse.x !== -1000) drawTopomapGlow();

            // 2. Draw static head boundaries
            drawHeadShape();

            // 3. Update physics/activation
            eegNodes.forEach(node => node.update());

            // 4. Draw dynamic network connections
            drawConnectivity();

            // 5. Draw the electrodes on top
            eegNodes.forEach(node => node.drawNode());

            requestAnimationFrame(animate);
        }

        // Initialize and start loop
        resize();
        animate();
    </script>
</body>
</html>
