<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saliency Map / ERD Ripple Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050608; /* Deep resting-state dark */
            overflow: hidden; /* Prevents scrollbars from the canvas */
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* The canvas is fixed to the background */
        #saliency-canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Example of how your portfolio content sits above the canvas */
        #portfolio-layer {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none; /* Allows mouse interactions to pass through to the canvas */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        p {
            color: rgba(255, 255, 255, 0.5);
            font-family: monospace;
        }
    </style>
</head>
<body>

    <canvas id="saliency-canvas"></canvas>

    <div id="portfolio-layer">
        <h1>INTERPRETABILITY LAYER</h1>
        <p>Move cursor to simulate attention mechanism & ERD</p>
    </div>

    <script>
        const canvas = document.getElementById('saliency-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let nodes = [];
        
        // --- TWEAKABLE HYPERPARAMETERS ---
        const spacing = 35;              // Density of the topographical grid
        const attentionRadius = 180;     // How far the cursor's "saliency" reaches
        const activationRate = 0.15;     // How fast the heat map spikes
        const erdDecayRate = 0.93;       // How fast the signal attenuates back to baseline (lower = faster)
        // ---------------------------------

        let mouse = { x: -1000, y: -1000 };

        // Track the "attention mechanism" (cursor)
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Remove focus when leaving the window
        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Handle window resizing smoothly
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initGrid();
        }
        window.addEventListener('resize', resize);

        class NeuralNode {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.baseY = y;
                this.heat = 0; // Represents saliency weight / ERD activation [0 to 1]
            }

            update() {
                // Calculate distance to the focal point
                const dx = mouse.x - this.baseX;
                const dy = mouse.y - this.baseY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // Spike heat if within the attention radius
                if (distance < attentionRadius) {
                    const activation = 1 - (distance / attentionRadius);
                    this.heat += activation * activationRate; 
                    if (this.heat > 1) this.heat = 1; // Cap at max activation
                }

                // Temporal decay (simulating signal returning to baseline)
                this.heat *= erdDecayRate;

                // Subtle topographical displacement based on activation weight
                this.x = this.baseX - (dx * this.heat * 0.15);
                this.y = this.baseY - (dy * this.heat * 0.15);
            }

            draw() {
                // Baseline resting state: faint, deep cyan
                let r = 12;
                let g = 28;
                let b = 45;
                let alpha = 0.2;
                let size = 1.5;

                // If activated, interpolate to vibrant orange/yellow saliency peak
                if (this.heat > 0.01) {
                    r = Math.floor(12 + (243 * this.heat));  // Shifts to 255
                    g = Math.floor(28 + (172 * this.heat));  // Shifts to 200
                    b = Math.floor(45 - (45 * this.heat));   // Shifts to 0
                    alpha = 0.2 + (this.heat * 0.8);
                    size = 1.5 + (this.heat * 3.5);
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.fill();
            }
        }

        function initGrid() {
            nodes = [];
            // Create a grid that slightly overflows the screen to prevent edge clipping
            for (let x = -spacing; x <= width + spacing; x += spacing) {
                for (let y = -spacing; y <= height + spacing; y += spacing) {
                    nodes.push(new NeuralNode(x, y));
                }
            }
        }

        function animate() {
            // Clear frame with a slight trailing effect for smoothness
            ctx.fillStyle = 'rgba(5, 6, 8, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Update physics
            nodes.forEach(node => node.update());

            // Draw dynamic connections between highly activated nodes
            for (let i = 0; i < nodes.length; i++) {
                if (nodes[i].heat < 0.25) continue; // Only process active regions to save GPU cycles

                for (let j = i + 1; j < nodes.length; j++) {
                    if (nodes[j].heat < 0.25) continue;

                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distanceSq = dx * dx + dy * dy;

                    // If nodes are close enough, draw a connecting neural thread
                    if (distanceSq < (spacing * 1.8) * (spacing * 1.8)) {
                        const avgHeat = (nodes[i].heat + nodes[j].heat) / 2;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(255, 120, 0, ${avgHeat * 0.6})`;
                        ctx.lineWidth = avgHeat * 1.5;
                        ctx.stroke();
                    }
                }
            }

            // Draw the nodes over the connecting lines
            nodes.forEach(node => node.draw());

            requestAnimationFrame(animate);
        }

        // Boot up
        resize();
        animate();
    </script>
</body>
</html>
